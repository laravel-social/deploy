# DigitalOcean "Deploy to DO" button template.
# Official contract (docs.digitalocean.com/products/app-platform/how-to/add-deploy-do-button):
# file MUST live at .do/deploy.template.yaml and the app spec MUST sit under a top-level `spec:` key.
# App Platform has no persistent disks: attach managed MySQL + S3-compatible Spaces before real use (see README).
spec:
  name: laravel-social
  services:
    - name: web
      image:
        registry_type: DOCKER_HUB
        registry: izdrail
        repository: app.laravelsocial.com
        tag: latest
      http_port: 13001
      instance_count: 1
      instance_size_slug: basic-xs
      routes:
        - path: /
      envs:
        - key: APP_KEY
          scope: RUN_TIME
          type: SECRET
          # no default value on purpose: App Platform prompts for it during deploy.
          # A valid Laravel key (base64:<32 bytes>, e.g. `php artisan key:generate --show`) is REQUIRED before the app can boot.
        - key: APP_URL
          scope: RUN_TIME
          value: ${APP_URL} # App Platform bindable variable - resolves to the app's public URL
